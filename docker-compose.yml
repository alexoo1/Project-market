services:
  db:
    image: postgres:16-alpine
    container_name: project_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-project_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_market}
      POSTGRES_DB: ${POSTGRES_DB:-project_market}
    ports:
      - "5432:5432"
    volumes:
      - project_market_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_market_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - project_market_media:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  project_market_db_data:
  project_market_media:
